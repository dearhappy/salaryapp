<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Scaffolding Construction Live</title>
    <style>
        body { margin: 0; background-color: #111; color: white; font-family: sans-serif; overflow: hidden; }
        #ui { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; border: 1px solid #444; pointer-events: none; }
        .status { color: #00ff00; font-weight: bold; }
        canvas { display: block; }
    </style>
</head>
<body>

    <div id="ui">
        <h2>Scaffolding Site Monitor</h2>
        <p>Syncing with Google Sheets...</p>
        <p>Status: <span class="status" id="loadStatus">Idle</span></p>
        <small>Source: Published CSV</small>
    </div>

    <!-- Load Three.js from CDN -->
    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- 1. SETTINGS ---
        // Using your new published CSV URL
        const CSV_URL = `https://docs.google.com/spreadsheets/d/e/2PACX-1vTMbJzqQVMMq0ihFb_gNbb7w93gk0ocrRkAXZoWGLDZQpl15-mJoU9W_l6Fcdnvfv0bUZ13CYmZyM1K/pub?output=csv`;

        // --- 2. THE STAGE ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);
        scene.fog = new THREE.Fog(0x222222, 10, 50);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
        camera.position.set(15, 10, 25);
        camera.lookAt(0, 5, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Ground Grid
        const grid = new THREE.GridHelper(100, 50, 0x444444, 0x222222);
        scene.add(grid);

        // --- 3. DATA SYNC LOGIC ---
        let objectMap = new Map(); // Store 3D objects by their row index

        async function fetchSheetData() {
            try {
                document.getElementById('loadStatus').innerText = "Syncing...";
                const response = await fetch(CSV_URL);
                const csvData = await response.text();
                
                // Parse CSV
                const rows = csvData.split('\n').map(r => r.split(',').map(cell => cell.replace(/"/g, '')));
                const dataRows = rows.slice(1); // Remove header

                dataRows.forEach((row, index) => {
                    const [type, x, y, z, color] = row;
                    if (!type || type.trim() === "") return;

                    let mesh = objectMap.get(index);

                    // Create object if it doesn't exist
                    if (!mesh) {
                        let geometry;
                        if (type.toLowerCase().includes("pole")) {
                            geometry = new THREE.CylinderGeometry(0.15, 0.15, 4);
                        } else {
                            geometry = new THREE.BoxGeometry(5, 0.2, 1.5);
                        }
                        
                        const material = new THREE.MeshStandardMaterial({ color: color || "#ffcc00" });
                        mesh = new THREE.Mesh(geometry, material);
                        scene.add(mesh);
                        objectMap.set(index, mesh);
                    }

                    // Update position smoothly
                    mesh.position.lerp(new THREE.Vector3(parseFloat(x), parseFloat(y), parseFloat(z)), 0.1);
                });

                document.getElementById('loadStatus').innerText = "Connected";
            } catch (err) {
                console.error("Fetch Error:", err);
                document.getElementById('loadStatus').innerText = "Error (Check Share Settings)";
                document.getElementById('loadStatus').style.color = "red";
            }
        }

        // --- 4. ENGINE ---
        function animate() {
            requestAnimationFrame(animate);
            
            // Subtle camera orbit for dynamic video feel
            const timer = Date.now() * 0.0002;
            camera.position.x = Math.cos(timer) * 30;
            camera.position.z = Math.sin(timer) * 30;
            camera.lookAt(0, 5, 0);

            renderer.render(scene, camera);
        }

        // Sync every 1 second
        setInterval(fetchSheetData, 1000);
        
        // Start
        animate();

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
