        // Parse logic
        function parseData(dataStr) {
            const lines = dataStr.trim().split('\n');
            const employees = [];
            for (let i = 1; i < lines.length; i++) {
                const cols = lines[i].split('\t').map(s => s.trim());
                if (cols.length >= 19) {
                    employees.push({
                        id: cols[0],
                        empCode: cols[1],
                        name: cols[2].replace(/\s+/g, ' '),
                        designation: cols[3],
                        doj: cols[4],
                        fixedGross: cols[5] || '0',
                        workingDays: cols[6] || '0',
                        payDays: cols[7] || '0',
                        otRate: cols[8] || '0',
                        otHours: cols[9] || '0',
                        flexiAllowance: cols[10] || '0',
                        otAllowance: cols[11] || '0',
                        perfBonus: cols[12] || '0',
                        earnedGross: cols[13] || '0',
                        pf: cols[14] || '0',
                        profTax: cols[15] || '0',
                        otherDed: cols[16] || '0',
                        totalDed: cols[17] || '0',
                        netPayable: cols[18] || '0',
                        holds: cols[19] || '',
                        holdsNet: cols[20] || ''
                    });
                }
            }
            return employees;
        }

        // Initialize state
        const employeesData = parseData(rawDataString);
        let selectedEmployee = null;

        // DOM Elements
        const searchInput = document.getElementById('search-input');
        const clearBtn = document.getElementById('clear-search');
        const resultsContainer = document.getElementById('results-container');
        const helperText = document.getElementById('helper-text');
        const recordCountText = document.getElementById('record-count');
        
        const searchView = document.getElementById('search-view');
        const slipView = document.getElementById('slip-view');
        const btnBack = document.getElementById('btn-back');
        const btnDownload = document.getElementById('btn-download');
        const slipContent = document.getElementById('slip-content');

        // Initial setup
        recordCountText.innerText = employeesData.length;

        // Event Listeners
        searchInput.addEventListener('input', handleSearch);
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            handleSearch({ target: searchInput });
        });

        btnBack.addEventListener('click', () => {
            selectedEmployee = null;
            renderViews();
        });

        // Generate JPG logic
        function downloadJPG() {
            if (!selectedEmployee) return;
            
            // Temporary visual feedback
            const originalText = btnDownload.innerHTML;
            btnDownload.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Generating...`;
            btnDownload.disabled = true;

            html2canvas(slipContent, {
                scale: 2, // Higher scale for better resolution
                backgroundColor: '#ffffff', // Force white background
                useCORS: true
            }).then(canvas => {
                const imgData = canvas.toDataURL('image/jpeg', 1.0);
                const link = document.createElement('a');
                
                // Format name securely for file download
                const safeName = selectedEmployee.name.replace(/[^a-z0-9]/gi, '_').toLowerCase();
                link.download = `Salary_Slip_${selectedEmployee.empCode}_${safeName}.jpg`;
                
                link.href = imgData;
                link.click();
                
                // Restore button
                btnDownload.innerHTML = originalText;
                btnDownload.disabled = false;
            }).catch(err => {
                console.error("Error generating JPG:", err);
                alert("Sorry, an error occurred while generating the image.");
                btnDownload.innerHTML = originalText;
                btnDownload.disabled = false;
            });
        }

        // Search logic
        function handleSearch(e) {
            const term = e.target.value.trim().toLowerCase();
            
            if (term.length > 0) {
                clearBtn.classList.remove('hidden');
                helperText.classList.add('hidden');
                
                const filtered = employeesData.filter(emp => 
                    emp.name.toLowerCase().includes(term) || 
                    emp.empCode.toLowerCase().includes(term)
                );
                renderResults(filtered);
            } else {
                clearBtn.classList.add('hidden');
                helperText.classList.remove('hidden');
                resultsContainer.innerHTML = '';
            }
        }

        // Render functions
        function renderResults(filtered) {
            if (filtered.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="text-center py-10 bg-white rounded-xl border border-slate-200 shadow-sm text-slate-500">
                        <svg class="w-12 h-12 text-slate-300 mx-auto mb-3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        <p class="text-lg font-medium text-slate-700">No worker found</p>
                        <p class="text-sm">Please check the spelling.</p>
                    </div>`;
                return;
            }

            resultsContainer.innerHTML = filtered.map(emp => `
                <div onclick="selectEmployee('${emp.empCode}')" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:shadow-md hover:border-blue-300 transition-all cursor-pointer flex flex-col sm:flex-row justify-between items-start sm:items-center group">
                    <div class="flex items-start">
                        <div class="bg-slate-100 text-slate-600 p-2.5 rounded-lg mr-4 group-hover:bg-blue-50 group-hover:text-blue-600 transition-colors">
                            <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </div>
                        <div>
                            <h3 class="font-bold text-slate-900 text-lg">${emp.name}</h3>
                            <div class="flex flex-wrap items-center text-sm text-slate-500 gap-x-4 mt-1">
                                <span class="flex items-center">
                                    <svg class="w-3.5 h-3.5 mr-1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
                                    ${emp.designation}
                                </span>
                            </div>
                        </div>
                    </div>
                    <div class="mt-4 sm:mt-0 self-end sm:self-auto flex items-center text-blue-600 font-medium text-sm">
                        View Slip
                        <svg class="w-4 h-4 ml-1" style="transform: rotate(180deg)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                    </div>
                </div>
            `).join('');
        }

        window.selectEmployee = function(code) {
            selectedEmployee = employeesData.find(e => e.empCode === code);
            renderViews();
        };

        function renderViews() {
            if (selectedEmployee) {
                // Show Slip, Hide Search
                searchView.classList.add('hidden');
                searchView.classList.remove('flex');
                slipView.classList.remove('hidden');
                slipView.classList.add('flex');
                
                generateSlipHTML(selectedEmployee);
            } else {
                // Show Search, Hide Slip
                slipView.classList.add('hidden');
                slipView.classList.remove('flex');
                searchView.classList.remove('hidden');
                searchView.classList.add('flex');
            }
        }

        function generateSlipHTML(emp) {
            const otText = emp.otHours !== '0' ? `(${emp.otHours} hrs)` : '';
            
            let holdsWarning = '';
            if (emp.holds) {
                holdsWarning = `
                <div class="bg-amber-50 border border-amber-200 text-amber-800 p-4 rounded-lg mb-6 flex items-start">
                    <svg class="w-5 h-5 mr-3 mt-0.5 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
                    <div>
                        <p class="font-bold">Payment Status: ${emp.holds}</p>
                        <p class="text-sm mt-1">Net Hold Amount: ₹${emp.holdsNet}</p>
                    </div>
                </div>`;
            }

            slipContent.innerHTML = `
                <!-- Company Header -->
                <div class="text-center mb-8 border-b-2 border-slate-200 pb-6">
                    <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900">EMPLOYEE SALARY SLIP</h1>
                    <p class="text-slate-500 mt-1 text-sm sm:text-base">Confidential Document</p>
                </div>

                <!-- Employee Details Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6 mb-8 bg-slate-50 p-4 sm:p-5 rounded-lg border border-slate-100">
                    <div class="space-y-3">
                        <div class="flex justify-between sm:justify-start">
                            <span class="text-slate-500 w-32 font-medium">Employee Name</span>
                            <span class="font-semibold text-slate-900">${emp.name}</span>
                        </div>
                        <div class="flex justify-between sm:justify-start">
                            <span class="text-slate-500 w-32 font-medium">Designation</span>
                            <span class="font-semibold text-slate-900">${emp.designation}</span>
                        </div>
                    </div>
                    <div class="space-y-3">
                        <div class="flex justify-between sm:justify-start">
                            <span class="text-slate-500 w-32 font-medium">Date of Joining</span>
                            <span class="font-semibold text-slate-900">${emp.doj}</span>
                        </div>
                        <div class="flex justify-between sm:justify-start">
                            <span class="text-slate-500 w-32 font-medium">Total Work Days</span>
                            <span class="font-semibold text-slate-900">24</span>
                        </div>
                        <div class="flex justify-between sm:justify-start">
                            <span class="text-slate-500 w-32 font-medium">Total Pay Days</span>
                            <span class="font-semibold text-slate-900">${emp.payDays}</span>
                        </div>
                    </div>
                </div>

                <!-- Financial Details Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8 mb-6">
                    
                    <!-- Earnings Column -->
                    <div>
                        <h3 class="text-lg font-bold text-slate-800 border-b border-slate-300 pb-2 mb-3 flex items-center">
                            <svg class="w-5 h-5 mr-2 text-green-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                            Earnings
                        </h3>
                        <div class="space-y-2">
                            <div class="flex justify-between py-1 border-b border-slate-100">
                                <span class="text-slate-600">Fixed Gross</span>
                                <span class="font-medium">₹${emp.fixedGross}</span>
                            </div>
                            <div class="flex justify-between py-1 border-b border-slate-100">
                                <span class="text-slate-600">OT Allowance ${otText}</span>
                                <span class="font-medium">₹${emp.otAllowance || '0'}</span>
                            </div>
                            <div class="flex justify-between py-1 border-b border-slate-100">
                                <span class="text-slate-600">Performance Bonus</span>
                                <span class="font-medium">₹${emp.perfBonus || '0'}</span>
                            </div>
                        </div>
                        <div class="flex justify-between py-3 mt-2 bg-green-50 px-3 rounded text-green-800 font-bold border border-green-100">
                            <span>Total Earned Gross</span>
                            <span>₹${emp.earnedGross}</span>
                        </div>
                    </div>

                    <!-- Deductions Column -->
                    <div>
                        <h3 class="text-lg font-bold text-slate-800 border-b border-slate-300 pb-2 mb-3 flex items-center">
                            <svg class="w-5 h-5 mr-2 text-red-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
                            Deductions
                        </h3>
                        <div class="space-y-2">
                            <div class="flex justify-between py-1 border-b border-slate-100">
                                <span class="text-slate-600">PF Employee</span>
                                <span class="font-medium">₹${emp.pf || '0'}</span>
                            </div>
                            <div class="flex justify-between py-1 border-b border-slate-100">
                                <span class="text-slate-600">Professional Tax</span>
                                <span class="font-medium">₹${emp.profTax || '0'}</span>
                            </div>
                            <div class="flex justify-between py-1 border-b border-slate-100">
                                <span class="text-slate-600">Other Deductions</span>
                                <span class="font-medium">₹${emp.otherDed || '0'}</span>
                            </div>
                        </div>
                        <div class="flex justify-between py-3 mt-2 bg-red-50 px-3 rounded text-red-800 font-bold border border-red-100 mt-auto">
                            <span>Total Deductions</span>
                            <span>₹${emp.totalDed || '0'}</span>
                        </div>
                    </div>

                </div>

                ${holdsWarning}

                <!-- Final Net Payable -->
                <div class="bg-slate-800 text-white p-5 sm:p-6 rounded-xl flex flex-col sm:flex-row justify-between items-center shadow-inner">
                    <span class="text-lg sm:text-xl font-medium mb-2 sm:mb-0">Net Payable Amount</span>
                    <span class="text-3xl sm:text-4xl font-bold tracking-tight">₹${emp.netPayable}</span>
                </div>

                <div class="mt-8 text-center text-xs text-slate-400 border-t border-slate-100 pt-4">
                    <p>This is a system generated slip and does not require a physical signature.</p>
                </div>
            `;
        }

    </script>
