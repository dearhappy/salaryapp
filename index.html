<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal 3D Story Engine</title>
    <style>
        body { margin: 0; background-color: #111; color: white; font-family: sans-serif; overflow: hidden; }
        #ui { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; border: 1px solid #444; pointer-events: none; max-width: 300px; }
        .status { color: #00ff00; font-weight: bold; }
        canvas { display: block; }
        .hint { font-size: 11px; opacity: 0.7; margin-top: 8px; line-height: 1.4; }
    </style>
</head>
<body>

    <div id="ui">
        <h2 style="margin:0 0 10px 0; font-size: 18px;">3D Story Engine</h2>
        <p style="margin:5px 0;">Status: <span class="status" id="loadStatus">Idle</span></p>
        <div class="hint">
            <strong>Sheet Headers Required:</strong><br>
            Object, X, Y, Z, Color, Scale, RotateY, ModelURL
        </div>
        <div class="hint">
            <strong>Supported:</strong> Primitives (Cube, Sphere) or Custom Models via GLB URL.
        </div>
    </div>

    <script type="importmap">
        { 
            "imports": { 
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            } 
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- 1. CONFIGURATION ---
        const CSV_URL = `https://docs.google.com/spreadsheets/d/e/2PACX-1vTMbJzqQVMMq0ihFb_gNbb7w93gk0ocrRkAXZoWGLDZQpl15-mJoU9W_l6Fcdnvfv0bUZ13CYmZyM1K/pub?output=csv`;

        // --- 2. SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Sky Blue
        scene.fog = new THREE.Fog(0x87ceeb, 20, 100);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(30, 20, 30);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const loader = new GLTFLoader();

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const sun = new THREE.DirectionalLight(0xffffff, 1.5);
        sun.position.set(10, 50, 10);
        sun.castShadow = true;
        scene.add(sun);

        // Green Grass Floor
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(200, 200),
            new THREE.MeshStandardMaterial({ color: 0x348C31 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // --- 3. OBJECT MANAGEMENT ---
        let objectMap = new Map();

        async function fetchSheetData() {
            try {
                document.getElementById('loadStatus').innerText = "Syncing...";
                const response = await fetch(CSV_URL);
                const csvData = await response.text();
                const rows = csvData.split('\n').map(r => r.split(',').map(cell => cell.replace(/"/g, '').trim()));
                const dataRows = rows.slice(1);

                dataRows.forEach((row, index) => {
                    // Expected Columns: Object, X, Y, Z, Color, Scale, RotateY, ModelURL
                    const [type, x, y, z, color, scale, rotateY, modelURL] = row;
                    if (!type) return;

                    let entry = objectMap.get(index);

                    // If model source changed or object doesn't exist, create it
                    if (!entry || entry.type !== type || entry.modelURL !== modelURL) {
                        if (entry) scene.remove(entry.mesh);
                        
                        const newEntry = { type, modelURL, mesh: new THREE.Group() };
                        
                        if (modelURL && (modelURL.includes('.glb') || modelURL.includes('.gltf'))) {
                            // Load External 3D Model (Animals/Birds/Humans)
                            loader.load(modelURL, (gltf) => {
                                const model = gltf.scene;
                                model.traverse(n => { if (n.isMesh) n.castShadow = true; });
                                newEntry.mesh.add(model);
                            });
                        } else {
                            // Basic Shapes
                            let geo;
                            if (type.toLowerCase() === 'sphere') geo = new THREE.SphereGeometry(0.5);
                            else if (type.toLowerCase() === 'cone') geo = new THREE.ConeGeometry(0.5, 1);
                            else geo = new THREE.BoxGeometry(1, 1, 1);
                            
                            const mat = new THREE.MeshStandardMaterial({ color: color || "#ffffff" });
                            const basicMesh = new THREE.Mesh(geo, mat);
                            basicMesh.castShadow = true;
                            newEntry.mesh.add(basicMesh);
                        }
                        
                        scene.add(newEntry.mesh);
                        objectMap.set(index, newEntry);
                        entry = newEntry;
                    }

                    // Update Position, Scale, and Rotation smoothly
                    const s = parseFloat(scale) || 1;
                    entry.mesh.scale.lerp(new THREE.Vector3(s, s, s), 0.1);
                    entry.mesh.position.lerp(new THREE.Vector3(parseFloat(x), parseFloat(y), parseFloat(z)), 0.1);
                    entry.mesh.rotation.y = THREE.MathUtils.lerp(entry.mesh.rotation.y, (parseFloat(rotateY) || 0) * (Math.PI / 180), 0.1);
                });

                document.getElementById('loadStatus').innerText = "Connected";
            } catch (err) {
                document.getElementById('loadStatus').innerText = "Sync Error";
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        setInterval(fetchSheetData, 1000);
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
